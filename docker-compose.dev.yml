name: smartx-hci-capacity-insight

services:
  web-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: nazawsze/smartx-hci-capacity-insight-web-api:v0.5.4
    command: ["sh", "-c", "chmod 600 /run/smartx-runtime.env && exec uvicorn app.v2.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SMARTX_PROJECT_PATH: /data/smartx-storage-forecast/project
      SMARTX_COMPOSE_PROJECT_NAME: smartx-hci-capacity-insight
      SMARTX_DB_PATH: /data/smartx.db
      SMARTX_PROMETHEUS_DATA_PATH: /prometheus-data
    volumes:
      - /data/smartx-storage-forecast/app:/data
      - /data/smartx-storage-forecast/upgrades:/data/upgrades
      - /data/smartx-storage-forecast/backups:/data/backups
      - /data/smartx-storage-forecast/exports:/data/exports
      - /data/smartx-storage-forecast/compose-runtime:/data/compose-runtime
      - /data/smartx-storage-forecast/prometheus:/prometheus-data
      - ./.env:/run/smartx-runtime.env
      - /data/smartx-storage-forecast/project:/data/smartx-storage-forecast/project:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
    networks:
      - smartx-net
    restart: unless-stopped

  collector-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    image: nazawsze/smartx-hci-capacity-insight-collector-worker:v0.5.4
    command: ["python", "-m", "app.v2.worker"]
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SMARTX_DB_PATH: /data/smartx.db
    volumes:
      - /data/smartx-storage-forecast/app:/data
      - /data/smartx-storage-forecast/upgrades:/data/upgrades
      - /data/smartx-storage-forecast/backups:/data/backups
      - /data/smartx-storage-forecast/exports:/data/exports
      - /data/smartx-storage-forecast/compose-runtime:/data/compose-runtime
    expose:
      - "9108"
    depends_on:
      - prometheus
    networks:
      - smartx-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: nazawsze/smartx-hci-capacity-insight-frontend:v0.5.4
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:80"
    depends_on:
      - web-api
    networks:
      - smartx-net
    restart: unless-stopped

  upgrade-runner:
    build:
      context: .
      dockerfile: backend/Dockerfile.upgrade
    image: nazawsze/smartx-hci-capacity-insight-upgrade-runner:v0.3.2
    command: ["sh", "-c", "chmod 600 /data/smartx-storage-forecast/project/.env && exec python -m app.upgrade_runner.main"]
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      SMARTX_PROJECT_PATH: /data/smartx-storage-forecast/project
      SMARTX_COMPOSE_PROJECT_NAME: smartx-hci-capacity-insight
      SMARTX_DB_PATH: /data/smartx.db
      SMARTX_PROMETHEUS_DATA_PATH: /prometheus-data
      SMARTX_HOST_DATA_PATH: /data/smartx-storage-forecast/app
      SMARTX_HOST_BACKUPS_PATH: /data/smartx-storage-forecast/backups
      SMARTX_HOST_COMPOSE_RUNTIME_PATH: /data/smartx-storage-forecast/compose-runtime
      SMARTX_HOST_PROMETHEUS_DATA_PATH: /data/smartx-storage-forecast/prometheus
      SMARTX_HOST_PROJECT_PATH: /data/smartx-storage-forecast/project
    volumes:
      - /data/smartx-storage-forecast/project:/data/smartx-storage-forecast/project
      - /data/smartx-storage-forecast/app:/data
      - /data/smartx-storage-forecast/upgrades:/data/upgrades
      - /data/smartx-storage-forecast/backups:/data/backups
      - /data/smartx-storage-forecast/exports:/data/exports
      - /data/smartx-storage-forecast/compose-runtime:/data/compose-runtime
      - /data/smartx-storage-forecast/prometheus:/prometheus-data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - prometheus
    networks:
      - smartx-net
    restart: unless-stopped

    healthcheck:
      # #96：容器 Up 不等于 runner 活着；心跳文件超过 90s 未更新即判不健康。
      # 但「文件从未生成」不能判不健康：交付安装基线是**已发布** runner v0.3.1，
      # 它没有 statefile 看门狗（v0.3.2 才有），全新安装时该文件本来就不存在。
      # 否则全新安装的 runner 会永久显示 (unhealthy)，把「基线版本差异」误报成「故障」。
      # 版本感知：#96 的心跳判据只对**带看门狗**的 runner 有意义（v0.3.2 起）。
      # 交付安装基线钉已发布 v0.3.1，它启动时只写一次状态文件、没有周期性心跳线程，
      # 若仍按「文件存在但超 90s」判定，全新安装约 90 秒后必然误报 (unhealthy)
      # （2026-10-20 接手轮实测：RestartCount=0、health API 仍 ok、runner 明明在跑）。
      # 因此先读镜像内 RUNNER_VERSION，低于 v0.3.2 直接判健康。
      test:
        - CMD-SHELL
        - |
          v=$$(cat /app/RUNNER_VERSION 2>/dev/null)
          if [ -n "$$v" ] && [ "$$(printf '%s\nv0.3.2\n' "$$v" | sort -V | head -n1)" != "v0.3.2" ]; then exit 0; fi
          f=/data/upgrade-runner-state.json
          [ ! -f "$$f" ] || test $(( $$(date +%s) - $$(stat -c %Y "$$f") )) -lt 90
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=400d"
    environment:
      TZ: CST-8
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/smartx-storage-forecast/project/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/smartx-storage-forecast/prometheus:/prometheus
    ports:
      - "9090:9090"
    networks:
      - smartx-net
    restart: unless-stopped


networks:
  smartx-net:
    driver: bridge
    name: smartx-hci-capacity-insight-net
    ipam:
      config:
        - subnet: 10.249.251.0/24
