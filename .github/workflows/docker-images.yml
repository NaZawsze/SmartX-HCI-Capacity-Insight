name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web-api
            context: .
            dockerfile: ./backend/Dockerfile
            image: smartx-hci-capacity-insight-web-api
          - name: collector-worker
            context: .
            dockerfile: ./backend/Dockerfile.worker
            image: smartx-hci-capacity-insight-collector-worker
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: smartx-hci-capacity-insight-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || github.ref }}
          fetch-depth: 0

      - name: Verify release tag points to main
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main" "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          main_commit="$(git rev-parse origin/main)"
          echo "tag ${GITHUB_REF_NAME} -> ${tag_commit}"
          echo "origin/main -> ${main_commit}"
          # 2026-10-21 修订：由「精确相等」放宽为「tag 必须是 main 的祖先或相等」。
          # 原因：发布后追加文档提交（如 CHANGELOG 状态翻转为已发布）是正常流程，
          # 精确相等会让 tag 工作流在事后重跑时误报失败（v0.5.4 实测踩到）。
          if ! git merge-base --is-ancestor "${tag_commit}" "${main_commit}"; then
            echo "Release tag ${GITHUB_REF_NAME} (${tag_commit}) is not contained in origin/main (${main_commit})." >&2
            echo "Refusing to build images from a tag that is not on main." >&2
            exit 1
          fi

      # 2026-10-14（pending #88 根因）：tag 名与 VERSION 文件是两份独立事实，此前无人核对——
      # v0.5.1u2 那次 tag 的 VERSION 已写成 v0.5.2，CI 照包照建，产出的镜像
      # /app/VERSION 自报 v0.5.2：同一 tag 名、两种内容，现场据此判版本必然错。
      # 构建前强制两者一致，不一致就拒绝发布（历史 tag 不受影响，只拦新的）。
      - name: Verify release tag matches VERSION file
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${GITHUB_REF_NAME} VERSION=${version}"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VERSION file (${version})." >&2
            echo "Refusing to publish images whose /app/VERSION would misreport the tag." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
